<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>码头钓记</title>
<meta name="theme-color" content="#1F5C66">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="钓记">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
:root{
  --paper:#EEF2EF; --surface:#F9FBFA; --ink:#14262B; --muted:#56696D; --line:#C9D5D1;
  --harbour:#1F5C66; --harbour-soft:#D5E5E3; --float:#E8A317; --on-float:#1B1605;
  --timber:#6B5B4B; --danger:#B3402E;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#0E1B1F; --surface:#15262B; --ink:#E4ECEA; --muted:#8FA3A6; --line:#2A4046;
    --harbour:#6FB7C0; --harbour-soft:#1B383E; --float:#F0B030; --on-float:#1B1605;
    --timber:#B79E85; --danger:#E0715E;
  }
}
:root[data-theme="dark"]{
  --paper:#0E1B1F; --surface:#15262B; --ink:#E4ECEA; --muted:#8FA3A6; --line:#2A4046;
  --harbour:#6FB7C0; --harbour-soft:#1B383E; --float:#F0B030; --on-float:#1B1605;
  --timber:#B79E85; --danger:#E0715E;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;background:var(--paper);color:var(--ink);
  font-family:"PingFang SC","Hiragino Sans GB","Noto Sans SC","Microsoft YaHei",system-ui,sans-serif;
  font-size:16px;line-height:1.55;
}
.num{font-family:"Barlow Condensed","DIN Alternate","Arial Narrow",system-ui,sans-serif;font-weight:600;letter-spacing:.01em}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--float);outline-offset:2px}

#app{max-width:560px;margin:0 auto;padding:18px 16px 96px;padding:calc(18px + env(safe-area-inset-top)) 16px calc(96px + env(safe-area-inset-bottom))}
.mast{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:14px}
.mast h1{font-size:1.35rem;margin:0;font-weight:700;letter-spacing:.04em}
.sync{font-size:.8rem;color:var(--muted)}

h2{font-size:1.5rem;line-height:1.25;margin:0 0 4px;font-weight:700}
h3{font-size:1rem;margin:28px 0 8px;font-weight:700;color:var(--harbour)}
.sub{color:var(--muted);font-size:.92rem;margin:0}
.sub .num{font-size:1.1rem;color:var(--ink)}

.tide{margin:16px -16px 0;background:var(--surface);border-block:1px solid var(--line);padding:10px 16px 6px}
.tide svg{display:block;width:100%;height:auto}
.tide-note{font-size:.82rem;color:var(--muted);margin:2px 0 6px}

.btn{display:inline-flex;align-items:center;justify-content:center;min-height:48px;padding:0 18px;border-radius:10px;
  border:1.5px solid var(--harbour);background:transparent;color:var(--harbour);font-weight:600}
.btn.primary{background:var(--float);border-color:var(--float);color:var(--on-float);min-height:60px;font-size:1.15rem;width:100%;border-radius:14px}
.btn.solid{background:var(--harbour);color:var(--paper)}
.btn.quiet{border-color:var(--line);color:var(--ink);font-weight:500}
.btn.danger{border-color:var(--danger);color:var(--danger)}
a.btn{text-decoration:none}
.mapwrap{position:relative;height:58vh;min-height:320px;margin:12px -16px 0;background:var(--harbour-soft)}
#map{position:absolute;top:0;right:0;bottom:0;left:0}
.cross{position:absolute;left:50%;top:50%;width:44px;height:44px;margin:-22px 0 0 -22px;z-index:1100;pointer-events:none;border:2px solid #fff;border-radius:50%;box-shadow:0 0 0 2px #14262B,inset 0 0 0 2px #14262B}
.cross::before,.cross::after{content:"";position:absolute;background:#E8A317;box-shadow:0 0 0 1px #14262B}
.cross::before{left:50%;top:-10px;bottom:-10px;width:2px;margin-left:-1px}
.cross::after{top:50%;left:-10px;right:-10px;height:2px;margin-top:-1px}
.btn.small{min-height:40px;padding:0 12px;font-size:.9rem}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.stack{display:grid;gap:10px;margin-top:16px}

.tags{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0 0}
.tag{font-size:.82rem;padding:3px 9px;border-radius:999px;background:var(--harbour-soft);color:var(--ink)}
.tag.todo{background:transparent;border:1px dashed var(--timber);color:var(--timber)}

.log{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}
.log li{border-bottom:1px solid var(--line)}
.log button{all:unset;box-sizing:border-box;display:grid;grid-template-columns:54px 1fr auto;gap:10px;align-items:center;width:100%;padding:12px 2px;cursor:pointer}
.log button:focus-visible{outline:3px solid var(--float)}
.log .t{font-size:1.15rem;color:var(--harbour)}
.log .main{font-weight:600}
.log .meta{display:block;font-weight:400;font-size:.84rem;color:var(--muted)}
.log .len{font-size:1.35rem;text-align:right;white-space:nowrap}
.log .len small{font-size:.8rem;font-weight:500;color:var(--muted);font-family:inherit}
.log.trips button{grid-template-columns:78px 1fr auto}
.empty{padding:22px 0;color:var(--muted)}

dl.env{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 18px;margin:0;border-top:1px solid var(--line)}
dl.env div{display:flex;justify-content:space-between;gap:8px;padding:8px 0;border-bottom:1px solid var(--line);font-size:.92rem}
dl.env dt{color:var(--muted)} dl.env dd{margin:0;font-weight:600;text-align:right}

/* bottom tab bar */
.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom);z-index:5}
.tabs div{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
.tabs button{all:unset;box-sizing:border-box;text-align:center;padding:14px 0 12px;font-weight:600;color:var(--muted);cursor:pointer;border-top:3px solid transparent;margin-top:-1px}
.tabs button[aria-current="page"]{color:var(--harbour);border-top-color:var(--float)}
.tabs button:focus-visible{outline:3px solid var(--float);outline-offset:-3px}

/* sheet */
[hidden]{display:none !important}
.sheet{position:relative;min-height:100vh;background:var(--paper)}
.sheet-in{max-width:560px;margin:0 auto;padding:14px 16px 24px}
.sheet-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.sheet-foot{position:-webkit-sticky;position:sticky;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding:10px 16px calc(10px + env(safe-area-inset-bottom))}
.sheet-foot > div{max-width:528px;margin:0 auto;display:flex;gap:10px}
.sheet-foot .btn.primary{flex:1}
.field{margin-top:18px}
.flabel{font-size:.9rem;font-weight:700;margin-bottom:8px}
.flabel small{font-weight:400;color:var(--muted);margin-left:6px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:44px;padding:0 14px;border-radius:999px;border:1.5px solid var(--line);background:var(--surface);font-size:.95rem}
.chip[aria-pressed="true"]{background:var(--harbour);border-color:var(--harbour);color:var(--paper);font-weight:600}
.txt{width:100%;min-height:48px;padding:0 12px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface);margin-top:8px}
textarea.txt{padding:10px 12px;min-height:76px;resize:vertical}
.pair{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.pair .field{margin-top:18px}
.pair .txt{margin-top:0}
.big-num{font-size:1.6rem;text-align:center}
details.more{margin-top:22px;border-top:1px solid var(--line);padding-top:6px}
details.more summary{padding:10px 0;font-weight:700;color:var(--harbour);cursor:pointer}
.section-note{margin:26px 0 0;padding-top:14px;border-top:1px solid var(--line);font-weight:700}
.section-note small{display:block;font-weight:400;color:var(--muted)}
.err{color:var(--danger);font-size:.9rem;margin-top:8px;min-height:1.2em}

/* stats */
.figs{display:grid;grid-template-columns:repeat(4,1fr);gap:0;border-block:1px solid var(--line);margin-top:14px}
.figs div{padding:12px 4px;text-align:center;border-left:1px solid var(--line)}
.figs div:first-child{border-left:0}
.figs b{display:block;font-size:1.9rem;line-height:1.1}
.figs span{font-size:.78rem;color:var(--muted)}
.bars{display:grid;gap:7px}
.bar{display:grid;grid-template-columns:minmax(84px,34%) 1fr;gap:10px;align-items:center;font-size:.9rem}
.bar .lab{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar .track{position:relative;height:24px;background:var(--harbour-soft);border-radius:4px;overflow:hidden}
.bar .fill{position:absolute;top:0;bottom:0;left:0;background:var(--harbour);border-radius:4px}
.bar .val{position:absolute;right:6px;top:0;line-height:24px;font-size:.82rem;color:var(--ink);mix-blend-mode:normal}
.cols{display:grid;gap:3px;align-items:end;height:96px;margin-top:6px}
.cols i{display:block;background:var(--harbour);border-radius:3px 3px 0 0;min-height:2px}
.cols i.zero{background:var(--line)}
.collabs{display:grid;gap:3px;font-size:.72rem;color:var(--muted);text-align:center;margin-top:4px;line-height:1.25}
.collabs b{display:block;color:var(--ink);font-size:.95rem}
.hint{font-size:.84rem;color:var(--muted);margin:6px 0 0}
.scroll-x{overflow-x:auto}

.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:var(--paper);
  padding:10px 16px;border-radius:10px;font-size:.92rem;z-index:40;max-width:88vw;text-align:center}
@media (prefers-reduced-motion:no-preference){ .toast{animation:pop .18s ease-out} @keyframes pop{from{opacity:0;transform:translate(-50%,8px)}} }
</style>
</head>
<body>
<div id="app"></div>
<nav class="tabs" aria-label="主导航"><div id="tabs"></div></nav>
<div id="sheet-root"></div>
<div id="toast-root" aria-live="polite"></div>
<input id="import-file" type="file" accept=".json,.csv,.txt,application/json,text/csv,text/plain" hidden>

<script>
"use strict";
window.addEventListener("error", function(e){ try{ var r = document.getElementById("toast-root"); r.innerHTML = '<div class="toast"></div>'; r.firstChild.textContent = "出错了：" + (e.message || e.type); }catch(_){} });
/* ---------- 预设 ---------- */
const PRESET = {
  species:['黄鳍鲷 Bream','沙尖 Whiting','牛尾鱼 Flathead','银鲹 Trevally','小真鲷 Snapper','裁缝鱼 Tailor','皮匠鱼 Leatherjacket','黄尾鲹 Yakka','鲭鱼 Mackerel','黑毛 Luderick','比目鱼 Flounder','鲶鱼 Catfish','魟鱼 Ray','鱿鱼 Squid','章鱼 Octopus'],
  bait:['虾肉','沙丁鱼','鱿鱼条','海虫','泥虾 Nipper','鸡肉','面团','鱼块','贻贝','蟹'],
  rig:['活铅钓组','胡须钓组','串钩','天平钓组'],
  spot:[]
};
const ENV = [
  {k:'weather',label:'天气',opts:['晴','多云','阴','小雨','大雨']},
  {k:'windDir',label:'风向',opts:['无风','北','东北','东','东南','南','西南','西','西北']},
  {k:'windForce',label:'风力',opts:['微风','中风','大风']},
  {k:'airTemp',label:'气温',unit:'°C',num:true},
  {k:'pressure',label:'气压',unit:'hPa',num:true},
  {k:'pressureTrend',label:'气压趋势',opts:['上升','平稳','下降']},
  {k:'clarity',label:'水色',opts:['清','微浑','浑']},
  {k:'waterTemp',label:'水温',unit:'°C',num:true},
  {k:'swell',label:'浪涌',opts:['平静','小浪','中浪','大浪']},
  {k:'boat',label:'渡轮和船只',opts:['少','一般','多']}
];
const TIDE_BINS = ['涨潮初','涨潮中','涨潮末','满潮平流','落潮初','落潮中','落潮末','低潮平流'];
const BIN_CENTER = {'涨潮初':.605,'涨潮中':.74,'涨潮末':.885,'满潮平流':0,'落潮初':.115,'落潮中':.26,'落潮末':.395,'低潮平流':.5};
const TIDE_PERIOD = 745; // 分钟，半日潮周期约 12 小时 25 分

/* ---------- 小工具 ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad = n => String(n).padStart(2,'0');
const todayStr = () => { const d = new Date(); return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`; };
const nowHM = () => { const d = new Date(); return `${pad(d.getHours())}:${pad(d.getMinutes())}`; };
const toMin = hm => { if(!hm) return null; const [h,m] = hm.split(':').map(Number); return h*60+m; };
const newId = p => p + Date.now().toString(36) + Math.random().toString(36).slice(2,6);
const numOrNull = v => { if(v === '' || v == null) return null; const n = Number(v); return Number.isFinite(n) ? n : null; };
const shortName = s => String(s||'').split(' ')[0];
function toast(msg){ const r = $('#toast-root'); r.innerHTML = `<div class="toast">${esc(msg)}</div>`; clearTimeout(toast.t); toast.t = setTimeout(()=> r.innerHTML = '', 2600); }

/* ---------- 月相与潮型 ---------- */
function moonInfo(dateStr){
  const d = new Date(dateStr + 'T12:00:00');
  const jd = d.getTime()/86400000 + 2440587.5;
  const syn = 29.530588853;
  let age = (jd - 2451550.1) % syn; if(age < 0) age += syn;
  const names = ['新月','蛾眉月','上弦月','盈凸月','满月','亏凸月','下弦月','残月'];
  const label = names[Math.floor(((age/syn)*8 + .5)) % 8];
  // 大潮通常在新月、满月之后一两天
  const toSpring = Math.min(Math.abs(age-1.5), Math.abs(age-16.3), Math.abs(age-31));
  const tideType = toSpring <= 2.2 ? '大潮' : toSpring >= 5.2 ? '小潮' : '中潮';
  return {moonAge: Math.round(age*10)/10, moonLabel: label, tideType};
}

/* ---------- 潮位相位：0 = 满潮，0.5 = 低潮 ---------- */
function phaseAt(trip, hm){
  if(!trip || !hm) return null;
  let t = toMin(hm); const start = toMin(trip.startTime);
  if(start != null && t < start - 90) t += 1440; // 跨过午夜
  const hi = toMin(trip.highTide), lo = toMin(trip.lowTide);
  if(hi == null && lo == null) return null;
  const mod = (a,n) => ((a % n) + n) % n;
  if(hi != null && lo != null){
    let fall = mod(lo - hi, TIDE_PERIOD);              // 满潮到低潮用时
    if(fall < 120 || fall > TIDE_PERIOD-120) fall = TIDE_PERIOD/2;
    const x = mod(t - hi, TIDE_PERIOD);
    return x < fall ? .5*x/fall : .5 + .5*(x-fall)/(TIDE_PERIOD-fall);
  }
  return hi != null ? mod((t-hi)/TIDE_PERIOD, 1) : mod((t-lo)/TIDE_PERIOD + .5, 1);
}
function tideLabel(p){
  if(p == null) return '';
  if(p < .04 || p >= .96) return '满潮平流';
  if(p < .19) return '落潮初'; if(p < .33) return '落潮中'; if(p < .46) return '落潮末';
  if(p < .54) return '低潮平流';
  if(p < .67) return '涨潮初'; if(p < .81) return '涨潮中'; return '涨潮末';
}
function tideSvg(dots, nowP){
  const W=340,H=134,mid=60,amp=34,base=H-26;
  const X = p => ((p+.5)%1)*W, Y = x => mid - amp*Math.cos(2*Math.PI*(x/W-.5));
  let d = ''; for(let i=0;i<=68;i++){ const x=i*W/68; d += (i?'L':'M') + x.toFixed(1)+' '+Y(x).toFixed(1); }
  const seen = {};
  const dotEls = dots.map(p => { const x=X(p), key=Math.round(x/9); const n = seen[key] = (seen[key]||0)+1;
    return `<circle cx="${x.toFixed(1)}" cy="${(Y(x)-(n-1)*10).toFixed(1)}" r="5" fill="var(--float)" stroke="var(--ink)" stroke-width="1.3"/>`; }).join('');
  let nowEl = '';
  if(nowP != null){ const x=X(nowP), y=Y(x);
    nowEl = `<line x1="${x}" x2="${x}" y1="${y}" y2="${base}" stroke="var(--timber)" stroke-width="1.5" stroke-dasharray="3 3"/>
      <text x="${Math.min(Math.max(x,18),W-18)}" y="${Math.max(y-12,11)}" text-anchor="middle" font-size="11" fill="var(--timber)" font-weight="700">现在</text>
      <circle cx="${x}" cy="${y}" r="3.2" fill="var(--timber)"/>`; }
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="潮位曲线，黄点是渔获">
    <path d="${d} L${W} ${base} L0 ${base} Z" fill="var(--harbour-soft)"/>
    <path d="${d}" fill="none" stroke="var(--harbour)" stroke-width="2.2"/>
    <line x1="0" x2="${W}" y1="${base}" y2="${base}" stroke="var(--line)"/>
    ${nowEl}${dotEls}
    <g font-size="11.5" fill="var(--muted)">
      <text x="2" y="${H-7}">低潮</text><text x="${W*.25}" y="${H-7}" text-anchor="middle">涨</text>
      <text x="${W/2}" y="${H-7}" text-anchor="middle" fill="var(--ink)" font-weight="700">满潮</text>
      <text x="${W*.75}" y="${H-7}" text-anchor="middle">落</text><text x="${W-2}" y="${H-7}" text-anchor="end">低潮</text>
    </g></svg>`;
}

/* ---------- 数据：只存在这台设备上（IndexedDB + localStorage 各一份） ---------- */
const KEY = 'wharflog.v1';
let L = {trips:[], catches:[], spots:[], lastBackup:null, savedAt:0};
const idb = {
  open(){ return new Promise((res,rej) => { if(typeof indexedDB === 'undefined') return rej(new Error('no idb'));
    const r = indexedDB.open('wharflog',1); r.onupgradeneeded = () => r.result.createObjectStore('kv'); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); }); },
  async get(k){ const d = await this.open(); return new Promise((res,rej) => { const q = d.transaction('kv').objectStore('kv').get(k); q.onsuccess = () => res(q.result); q.onerror = () => rej(q.error); }); },
  async set(k,v){ const d = await this.open(); return new Promise((res,rej) => { const tx = d.transaction('kv','readwrite'); tx.objectStore('kv').put(v,k); tx.oncomplete = () => res(); tx.onerror = () => rej(tx.error); }); }
};
function persist(){ L.savedAt = Date.now(); const snap = JSON.stringify(L); try{ localStorage.setItem(KEY, snap); }catch(e){} idb.set('state', snap).catch(() => {}); }
async function loadData(){
  let a = null, b = null;
  try{ a = JSON.parse(localStorage.getItem(KEY)); }catch(e){}
  try{ b = JSON.parse(await idb.get('state')); }catch(e){}
  const best = [a,b].filter(Boolean).sort((x,y) => (y.savedAt||0)-(x.savedAt||0))[0];
  if(best) L = Object.assign(L, best);
  if(!Array.isArray(L.spots)) L.spots = [];
}
const clean = doc => { const o = {...doc}; delete o._dirty; return o; };
function writeDoc(kind, doc){ doc = clean(doc); const i = L[kind].findIndex(x => x.id === doc.id); if(i >= 0) L[kind][i] = doc; else L[kind].push(doc); persist(); render(); return Promise.resolve(); }
function deleteDoc(kind, id){ L[kind] = L[kind].filter(x => x.id !== id); persist(); render(); return Promise.resolve(); }

/* ---------- 水深：钓点的海图水深 + 当时的潮高 = 鱼上钩时的实际水深 ---------- */
const ZONES = [['桩脚边','pile'],['近','near'],['中','mid'],['远','far']];
const BOTTOMS = ['沙','泥','礁石','海草','碎石贝壳','混合'];
const spotOf = name => L.spots.find(s => s.name === name) || null;
const r1 = v => Math.round(v*10)/10;
function tideHeightAt(trip, hm){
  const p = phaseAt(trip, hm), hi = numOrNull(trip && trip.highTideM), lo = numOrNull(trip && trip.lowTideM);
  if(p == null || hi == null || lo == null) return null;
  return lo + (hi-lo)*(1+Math.cos(2*Math.PI*p))/2;
}
function chartDepth(spotName, cast){ const s = spotOf(spotName), z = ZONES.find(z => z[0] === cast); return s && z ? numOrNull(s[z[1]]) : null; }
function depthAt(trip, hm, cast){ const c = chartDepth(trip && trip.spot, cast), h = tideHeightAt(trip, hm); return c == null || h == null ? null : r1(c+h); }
function recomputeDepths(spotName){   // 钓点水深改了以后，把这个钓点所有自动算的水深重算一遍
  L.trips.filter(t => t.spot === spotName).forEach(t => L.catches.filter(c => c.tripId === t.id && !c.depthManual).forEach(c => { c.depthM = depthAt(t, c.time, c.cast); }));
}

/* ---------- 位置：GPS、地图选点、跳到海图 ---------- */
const hasLoc = s => s && numOrNull(s.lat) != null && numOrNull(s.lng) != null;
const chartUrl = s => `https://fishing-app.gpsnauticalcharts.com/i-boating-fishing-web-app/fishing-marine-charts-navigation.html#16.5/${s.lat}/${s.lng}/0`;
const r6 = v => Math.round(v*1e6)/1e6;
function locate(){ return new Promise((res,rej) => { if(!navigator.geolocation) return rej(new Error('none'));
  navigator.geolocation.getCurrentPosition(p => res(p.coords), rej, {enableHighAccuracy:true, timeout:15000, maximumAge:10000}); }); }
function locField(f){
  return `<div class="field"><div class="flabel">位置<small class="num">${hasLoc(f) ? f.lat.toFixed(5) + ', ' + f.lng.toFixed(5) : '还没定位'}</small></div>

    <p class="hint">人在码头上就用当前位置；在家里就去地图上选。定了位置以后，“看海图水深”会直接跳到这个码头的海图。</p></div>`;
}
let leafletLoading = null, map = null, mapLayers = null;
function loadLeaflet(){   // 地图库只在选点时才联网加载。它挂在 window.L 上，和本页的数据变量 L 不是一回事
  if(window.L && window.L.map) return Promise.resolve();
  if(leafletLoading) return leafletLoading;
  const tryFrom = base => new Promise((res,rej) => {
    const css = document.createElement('link'); css.rel = 'stylesheet'; css.href = base + 'leaflet.css'; document.head.appendChild(css);
    const js = document.createElement('script'); js.src = base + 'leaflet.js'; js.onload = () => res(); js.onerror = () => { css.remove(); js.remove(); rej(new Error('load')); }; document.head.appendChild(js); });
  leafletLoading = tryFrom('https://unpkg.com/leaflet@1.9.4/dist/').catch(() => tryFrom('https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/')).catch(e => { leafletLoading = null; throw e; });
  return leafletLoading;
}
function renderPicker(){

}
function initMap(){
  if(!S.sheet || !S.sheet.picking || !$('#map')) return;
  const Lf = window.L, f = S.sheet.data, others = L.spots.filter(hasLoc);
  const start = hasLoc(f) ? [[f.lat, f.lng], 18] : others.length ? [[others[0].lat, others[0].lng], 14] : [[-33.8568, 151.2153], 13];
  map = Lf.map('map', {zoomControl:true}).setView(start[0], start[1]);
  mapLayers = {
    sat: Lf.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {maxNativeZoom:19, maxZoom:21, attribution:'Esri, Maxar, Earthstar Geographics'}),
    map: Lf.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {maxNativeZoom:19, maxZoom:21, attribution:'&copy; OpenStreetMap contributors'})
  };
  mapLayers.sat.addTo(map);
  others.filter(s => s.name !== f.name).forEach(s => Lf.circleMarker([s.lat, s.lng], {radius:6, color:'#14262B', weight:2, fillColor:'#E8A317', fillOpacity:1}).addTo(map).bindTooltip(s.name));

/* ---------- 查询 ---------- */
const tripsSorted = () => [...L.trips].sort((a,b) => (b.date+(b.startTime||'')).localeCompare(a.date+(a.startTime||'')) || (b.createdAt||0)-(a.createdAt||0));
const activeTrip = () => tripsSorted().find(t => !t.endTime) || null;
function catchesOf(tripId){
  const t = L.trips.find(x => x.id === tripId), start = t ? toMin(t.startTime) : null;
  const key = c => { let m = toMin(c.time) ?? 0; if(start != null && m < start - 90) m += 1440; return m; };
  return L.catches.filter(c => c.tripId === tripId).sort((a,b) => key(a)-key(b));
}
function ranked(kind, values){
  const n = {}; values.filter(Boolean).forEach(v => n[v] = (n[v]||0)+1);
  const seen = Object.keys(n).sort((a,b) => n[b]-n[a]);

}

    ${last ? `<h3>上一次</h3><ul class="log trips">${tripRow(last)}</ul>` : ''}`;

function elapsed(t){
  const s = new Date(`${t.date}T${t.startTime||'00:00'}:00`).getTime(); let m = Math.max(0, Math.round((Date.now()-s)/60000));

    <h3>环境</h3>
    ${live ? `<div class="tags">${filled.map(f => `<span class="tag">${f.label} ${esc(t[f.k])}${f.unit||''}</span>`).join('')}${missing?`<span class="tag todo">还有 ${missing} 项没填，可以回家补</span>`:''}</div>` : envList(t)}
    ${t.note ? `<p class="hint">备注：${esc(t.note)}</p>` : ''}

    </div>`;
}
function depthNote(t, live){ const sp = spotOf(t.spot); return depthNoteBody(t, live) + (hasLoc(sp) ? `<p class="tide-note"><a href="${chartUrl(sp)}" target="_blank" rel="noopener" style="color:var(--harbour);font-weight:600">看这个钓点的海图水深</a></p>` : ''); }
function depthNoteBody(t, live){

  const parts = ZONES.filter(z => numOrNull(sp[z[1]]) != null).map(z => `${z[0]} <span class="num">${r1(numOrNull(sp[z[1]])+h).toFixed(1)}</span>`);

function catchRow(c){

/* ---------- 统计 ---------- */
function barList(rows, fmt){
  const max = Math.max(...rows.map(r => r.v), 0) || 1;
  return `<div class="bars">${rows.map(r => `<div class="bar"><span class="lab">${esc(r.label)}</span><span class="track"><span class="fill" style="width:${Math.max(r.v/max*100, r.v?3:0)}%"></span><span class="val">${esc(fmt ? fmt(r) : r.v)}</span></span></div>`).join('')}</div>`;
}
function viewStats(){
  const trips = L.trips, cs = L.catches.filter(c => trips.some(t => t.id === c.tripId));
  if(!trips.length) return `<h2>统计</h2><p class="empty">记上几次出钓之后，这里会告诉你什么潮段、什么饵、哪个码头最出鱼。</p>`;
  const done = trips.filter(t => t.endTime), blank = done.filter(t => !cs.some(c => c.tripId === t.id)).length;
  const lost = cs.filter(c => c.outcome === '跑了').length;

  // 各潮段：渔获数 和 每小时渔获（按实际在各潮段钓了多久来折算）
  const cnt = Object.fromEntries(TIDE_BINS.map(b => [b,0])), eff = Object.fromEntries(TIDE_BINS.map(b => [b,0]));
  cs.forEach(c => { if(c.tideLabel in cnt) cnt[c.tideLabel]++; });
  done.forEach(t => { if(!(t.highTide||t.lowTide) || !t.startTime) return;
    let a = toMin(t.startTime), b = toMin(t.endTime); if(b < a) b += 1440; b = Math.min(b, a + 1440);
    for(let m = a; m < b; m += 10){ const p = phaseAt(t, `${pad(Math.floor(m/60)%24)}:${pad(m%60)}`); eff[tideLabel(p)] += 10; } });
  const rate = TIDE_BINS.map(b => eff[b] >= 30 ? cnt[b]/(eff[b]/60) : null), maxRate = Math.max(...rate.map(r => r||0)) || 1;
  const maxCnt = Math.max(...Object.values(cnt)) || 1, useRate = rate.some(r => r != null);
  const tideChart = `<div class="cols" style="grid-template-columns:repeat(8,1fr)">${TIDE_BINS.map((b,i) => { const v = useRate ? (rate[i]||0)/maxRate : cnt[b]/maxCnt; return `<i class="${v?'':'zero'}" style="height:${Math.max(v*100,2)}%"></i>`; }).join('')}</div>
    <div class="collabs" style="grid-template-columns:repeat(8,1fr)">${TIDE_BINS.map((b,i) => `<span><b class="num">${cnt[b]}</b>${b.replace('平流','')}${rate[i]!=null?`<br>${rate[i].toFixed(1)}/时`:''}</span>`).join('')}</div>`;

  const hours = Array(24).fill(0); cs.forEach(c => { const m = toMin(c.time); if(m != null) hours[Math.floor(m/60)]++; });
  const maxH = Math.max(...hours) || 1;

  const group = (arr, key) => { const g = {}; arr.forEach(x => { const k = key(x); if(k) (g[k] = g[k] || []).push(x); }); return g; };
  const bySpecies = Object.entries(group(cs, c => c.species)).map(([k,a]) => { const ls = a.map(c => c.lengthCm).filter(v => v != null);
    return {label:shortName(k), v:a.length, avg: ls.length ? ls.reduce((s,v)=>s+v,0)/ls.length : null, max: ls.length ? Math.max(...ls) : null}; }).sort((a,b) => b.v-a.v);
  const byBait = Object.entries(group(cs, c => c.bait)).map(([k,a]) => ({label:shortName(k), v:a.length})).sort((a,b) => b.v-a.v);
  const perTrip = key => Object.entries(group(trips, key)).map(([k,ts]) => { const n = cs.filter(c => ts.some(t => t.id === c.tripId)).length;
    return {label:k, v:n/ts.length, trips:ts.length, fish:n}; }).sort((a,b) => b.v-a.v);
  const byCast = ZONES.map(z => ({label:z[0], v:cs.filter(c => c.cast === z[0]).length})).filter(r => r.v);
  const dvals = cs.map(c => numOrNull(c.depthM)).filter(v => v != null); let depthChart = '';
  if(dvals.length){ const lo = Math.floor(Math.min(...dvals)), hi = Math.floor(Math.max(...dvals)), bins = []; for(let d = lo; d <= hi; d++) bins.push(dvals.filter(v => Math.floor(v) === d).length);
    const mx = Math.max(...bins) || 1, n = bins.length;
    depthChart = `<h3>哪个水深出鱼</h3><div class="cols" style="grid-template-columns:repeat(${n},1fr)">${bins.map(b => `<i class="${b?'':'zero'}" style="height:${Math.max(b/mx*100,2)}%"></i>`).join('')}</div>
      <div class="collabs" style="grid-template-columns:repeat(${n},1fr)">${bins.map((b,i) => `<span><b class="num">${b}</b>${lo+i}–${lo+i+1} m</span>`).join('')}</div>
      <p class="hint">这是鱼上钩那一刻的实际水深（海图水深加当时潮高）。这里只是条数，没法按“在各个水深钓了多久”折算，所以你常抛的位置天然会多一些。</p>`; }
  const tripFmt = r => `${r.v.toFixed(1)} 条/次（${r.trips} 次）`;
  const envBlocks = [['潮型', t => t.tideType], ...ENV.filter(f => f.opts).map(f => [f.label, t => t[f.k]])]
    .map(([label,key]) => { const rows = perTrip(key); return rows.length > 1 ? `<h3>${label}与每次渔获</h3>${barList(rows, tripFmt)}` : ''; }).join('');

  return `<h2>统计</h2>
    <div class="figs"><div><b class="num">${trips.length}</b><span>出钓</span></div><div><b class="num">${cs.length - lost}</b><span>上岸</span></div>

async function saveSheet(){
  const s = S.sheet, f = {...s.data}, err = m => { $('#form-err').textContent = m; };

    if(f.basis === '现在实测'){ const t = activeTrip(); h = t && t.spot === f.name ? tideHeightAt(t, nowHM()) : null;
      if(h == null) return err('实测换算需要：正在这个钓点出钓，并且这次出钓填了满潮、低潮的时间和潮高。'); }
    ZONES.forEach(z => { const v = numOrNull(f[z[1]]); f[z[1]] = v == null ? null : r1(v - h); });

    closeSheetQuiet(); await writeDoc('trips', f);
    for(const c of L.catches.filter(c => c.tripId === f.id)){   // 潮汐改了，重算这次每条鱼的潮段和水深
      const p = c.tideManual ? c.tideP : phaseAt(f, c.time), dm = c.depthManual ? c.depthM : depthAt(f, c.time, c.cast);
      if(p !== c.tideP || dm !== c.depthM){ await writeDoc('catches', {...c, tideP:p, tideLabel:c.tideManual ? c.tideLabel : (tideLabel(p)||null), depthM:dm}); } }
    toast(s.isNew ? '已开始，上鱼了点“记一条鱼”' : '已保存');
  } else {
    if(!f.species) return err('先选鱼种。认不出来可以在下面输入“不认识”。');
    f.lengthCm = numOrNull(f.lengthCm); f.weightG = numOrNull(f.weightG);
    { const trip = L.trips.find(t => t.id === f.tripId), th = tideHeightAt(trip, f.time); f.tideM = th == null ? null : Math.round(th*100)/100;
      f.depthM = f.depthManual ? numOrNull(f.depthM) : depthAt(trip, f.time, f.cast); if(f.depthM == null) f.depthManual = false; }
    if(f.tideManual && f.tideLabel) f.tideP = BIN_CENTER[f.tideLabel]; if(!f.tideLabel){ f.tideP = null; }
    closeSheetQuiet(); await writeDoc('catches', f); toast('已保存这条鱼');
  }
}

async function saveFile(name, text, mime){
  const blob = new Blob([text], {type:mime});
  if(window.matchMedia && matchMedia('(pointer:coarse)').matches && navigator.canShare){   // 手机上走系统分享，可以存到“文件”、发给自己
    try{ const f = new File([blob], name, {type:mime}); if(navigator.canShare({files:[f]})){ await navigator.share({files:[f], title:name}); return true; } }
    catch(e){ if(e && e.name === 'AbortError') return false; }
  }
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 5000); return true;
}

function parseCsv(text){
  const rows = []; let row = [], cur = '', q = false; text = text.replace(/^\ufeff/, '');
  for(let i = 0; i < text.length; i++){ const ch = text[i];
    if(q){ if(ch === '"'){ if(text[i+1] === '"'){ cur += '"'; i++; } else q = false; } else cur += ch; }
    else if(ch === '"') q = true; else if(ch === ','){ row.push(cur); cur = ''; }
    else if(ch === '\n' || ch === '\r'){ if(ch === '\r' && text[i+1] === '\n') i++; row.push(cur); rows.push(row); row = []; cur = ''; }
    else cur += ch; }
  if(cur !== '' || row.length){ row.push(cur); rows.push(row); }
  return rows.filter(r => r.some(c => c !== ''));
}
function importCsv(text){
  const rows = parseCsv(text); if(rows.length < 2) throw new Error('empty');
  const H = rows[0], col = n => H.indexOf(n); if(col('日期') < 0 || col('钓点') < 0) throw new Error('format');
  const get = (r,n) => { const i = col(n); return i >= 0 && r[i] !== '' ? r[i] : null; };
  const byKey = new Map(); let nt = 0, nc = 0;
  const exists = new Set(L.trips.map(t => [t.date,t.spot,t.startTime||''].join('|')));
  rows.slice(1).forEach((r,ri) => {
    const key = [get(r,'日期'), get(r,'钓点'), get(r,'开始')||''].join('|'); if(exists.has(key)) return;
    let t = byKey.get(key);
    if(!t){ t = {id:newId('t_') + nt, date:get(r,'日期'), spot:get(r,'钓点'), startTime:get(r,'开始'), endTime:get(r,'收竿'), highTide:get(r,'满潮'), lowTide:get(r,'低潮'), highTideM:numOrNull(get(r,'满潮潮高m')), lowTideM:numOrNull(get(r,'低潮潮高m')), note:get(r,'出钓备注'), createdAt:Date.now()+ri};
      ENV.forEach(f => { const v = get(r, f.label + (f.unit ? `(${f.unit})` : '')); t[f.k] = f.num ? numOrNull(v) : v; });
      Object.assign(t, moonInfo(t.date)); byKey.set(key, t); L.trips.push(t); nt++; }
    { const la = numOrNull(get(r,'钓点纬度')), lo = numOrNull(get(r,'钓点经度')); if(la != null && lo != null && !spotOf(t.spot)) L.spots.push({name:t.spot, lat:la, lng:lo}); }
    const sp = get(r,'鱼种'); if(!sp) return;
    const c = {id:newId('c_') + nc, tripId:t.id, time:get(r,'渔获时间'), species:sp, lengthCm:numOrNull(get(r,'长度cm')), weightG:numOrNull(get(r,'重量g')), bait:get(r,'饵'), rig:get(r,'钓组'),
      hook:get(r,'钩号')||'', cast:get(r,'抛投'), tideLabel:get(r,'潮段'), tideP:numOrNull(get(r,'潮位相位(0=满潮)')), outcome:get(r,'结果'), note:get(r,'渔获备注'), depthM:numOrNull(get(r,'水深m')), tideM:numOrNull(get(r,'潮高m')), createdAt:Date.now()+ri};
    c.depthManual = c.depthM != null;
    c.tideManual = !!c.tideLabel && tideLabel(phaseAt(t, c.time)) !== c.tideLabel;
    L.catches.push(c); nc++;
  });
  return [nt, nc];
}
function importJson(text){
  const d = JSON.parse(text); if(!d || !Array.isArray(d.trips) || !Array.isArray(d.catches)) throw new Error('format');
  const have = k => new Set(L[k].map(x => x.id)); let nt = 0, nc = 0;
  const ht = have('trips'); d.trips.forEach(t => { if(t && t.id && !ht.has(t.id)){ L.trips.push(clean(t)); nt++; } });
  (Array.isArray(d.spots) ? d.spots : []).forEach(s => { if(s && s.name && !spotOf(s.name)) L.spots.push(s); });
  const hc = have('catches'); d.catches.forEach(c => { if(c && c.id && !hc.has(c.id)){ L.catches.push(clean(c)); nc++; } });
  return [nt, nc];
}
document.getElementById('import-file').addEventListener('change', async e => {
  const file = e.target.files[0]; e.target.value = ''; if(!file) return;
  try{ const text = await file.text(); const [nt,nc] = text.trim().startsWith('{') ? importJson(text) : importCsv(text);
    persist(); render(); toast(nt || nc ? `导入了 ${nt} 次出钓、${nc} 条鱼` : '这些记录已经都在了，没有新增'); }
  catch(err){ toast('这个文件读不了。要用这里备份出来的 .json，或者“码头钓记”导出的 .csv'); }
});

  }
  const b = e.target.closest('[data-act]'); if(!b) return;
  const act = b.dataset.act;
  if(act === 'tab'){ S.tab = b.dataset.tab; S.tripId = null; render(); window.scrollTo(0,0); }
  else if(act === 'new-trip') newTripForm();
  else if(act === 'edit-trip'){ const t = L.trips.find(x => x.id === b.dataset.trip); openSheet({type:'trip', isNew:false, data:clean(t)}); }
  else if(act === 'end-trip'){ const t = L.trips.find(x => x.id === b.dataset.trip); if(!confirmTap(b, '再点一次确认收竿')) return;
    await writeDoc('trips', {...clean(t), endTime: t.date === todayStr() || elapsed(t) ? nowHM() : (t.startTime||nowHM())}); toast('已收竿。环境没填全的话，回家在“记录”里补。'); }
  else if(act === 'new-catch') newCatchForm(b.dataset.trip);
  else if(act === 'spot-locate'){ b.textContent = '正在定位…';
    try{ const c = await locate(); if(S.sheet && S.sheet.type === 'spot'){ S.sheet.data.lat = r6(c.latitude); S.sheet.data.lng = r6(c.longitude); renderSheet(); toast(`已定位，精度约 ±${Math.round(c.accuracy)} 米${c.accuracy > 30 ? '，偏差有点大，可以到地图上再挪一下' : ''}`); } }
    catch(e){ b.textContent = '用当前位置'; toast(e && e.code === 1 ? '没有定位权限。到手机设置里允许这个应用使用位置，或者改用地图选点。' : '没定到位，到开阔一点的地方再试，或者改用地图选点。'); } }
  else if(act === 'spot-pick'){ S.sheet.picking = true; renderSheet(); try{ window.scrollTo(0,0); }catch(e){} }
  else if(act === 'pick-cancel') closePicker();
  else if(act === 'pick-ok'){ if(!map){ closePicker(); return; } const c = map.getCenter(); S.sheet.data.lat = r6(c.lat); S.sheet.data.lng = r6(c.lng); closePicker(); toast('位置已选好，记得点“保存钓点”'); }
  else if(act === 'pick-layer'){ if(!map) return; const k = b.dataset.layer; Object.entries(mapLayers).forEach(([n,l]) => n === k ? l.addTo(map) : map.removeLayer(l));
    document.querySelectorAll('[data-act="pick-layer"]').forEach(x => x.setAttribute('aria-pressed', String(x === b))); }
  else if(act === 'pick-locate'){ if(!map) return; try{ const c = await locate(); if(map) map.setView([c.latitude, c.longitude], 18); }catch(e){ toast('没定到位，手动拖地图吧。'); } }
  else if(act === 'new-spot') openSheet({type:'spot', isNew:true, data:{name:'', basis:'海图水深'}});
  else if(act === 'edit-spot'){ const n = b.dataset.spot, sp = spotOf(n); openSheet({type:'spot', isNew:false, data:{...(sp || {name:n}), basis:'海图水深'}}); }
  else if(act === 'edit-catch'){ const c = L.catches.find(x => x.id === b.dataset.id); openSheet({type:'catch', isNew:false, data:clean(c)}); }
  else if(act === 'del-catch'){ if(!confirmTap(b, '再点一次删除')) return; const id = b.dataset.id; closeSheetQuiet(); await deleteDoc('catches', id); toast('已删除'); }
  else if(act === 'del-trip'){ if(!confirmTap(b, '再点一次，连同渔获一起删除')) return; const id = b.dataset.trip;
    for(const c of L.catches.filter(c => c.tripId === id)) await deleteDoc('catches', c.id);
    S.tripId = null; await deleteDoc('trips', id); toast('已删除'); }
  else if(act === 'open-trip'){ S.tab = 'history'; S.tripId = b.dataset.trip; render(); window.scrollTo(0,0); }
  else if(act === 'back'){ S.tripId = null; render(); }
  else if(act === 'close-sheet') closeSheet();
  else if(act === 'save-sheet') saveSheet();
  else if(act === 'export') exportCsv();
  else if(act === 'backup') backupJson();
  else if(act === 'import') $('#import-file').click();
});
document.addEventListener('input', e => {
  if(!S.sheet) return; const el = e.target;
  if(el.dataset.input){ S.sheet.data[el.dataset.input] = el.value; if(el.dataset.input === 'time'){ refreshAutoTide(); refreshAutoDepth(); } if(el.dataset.input === 'depthM' && S.sheet.type === 'catch') S.sheet.data.depthManual = el.value !== ''; }
  else if('custom' in el.dataset){ const wrap = el.closest('[data-field]'); S.sheet.data[wrap.dataset.field] = el.value.trim() || null;
    wrap.querySelectorAll('.chip').forEach(c => c.setAttribute('aria-pressed','false')); }
});
setInterval(() => { if(!S.sheet && S.tab === 'today' && activeTrip() && !armed) render(); }, 60000);

render();
loadData().then(render);
if(navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
if('serviceWorker' in navigator && location.protocol === 'https:') window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
</script>
</body>
</html>
